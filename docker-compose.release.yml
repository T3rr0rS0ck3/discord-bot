services:
  discord-bot:
    image: ${DISCORD_BOT_IMAGE:-ghcr.io/t3rr0rs0ck3/discord-bot:latest}
    container_name: discord-bot
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "3000:3000"
    volumes:
      - discord-bot-data:/app/data
    environment:
      - NODE_ENV=production
      - BOT_DATA_DIR=/app/data
      - ADMIN_UI_HOST=0.0.0.0
volumes:
  discord-bot-data:
