services:
  discord-bot:
    image: ${DISCORD_BOT_IMAGE:-ghcr.io/t3rr0rs0ck3/discord-bot:latest}
    container_name: discord-bot
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "3000:3000"
    volumes:
      - discord-bot-data:/app/data
    environment:
      - NODE_ENV=production
      - ADMIN_UI_HOST=0.0.0.0

  sqlite-web:
    image: python:3.12-slim
    container_name: discord-bot-sqlite-web
    restart: unless-stopped
    depends_on:
      - discord-bot
    volumes:
      - discord-bot-data:/data:ro
    command:
      - sh
      - -c
      - pip install --no-cache-dir sqlite-web && sqlite_web /data/bot-config.sqlite --host 0.0.0.0 --port 8080

volumes:
  discord-bot-data:
