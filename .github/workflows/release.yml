name: Build And Release On Tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag version
        id: vars
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export Docker image archive
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          IMAGE_REF="${IMAGE_NAME}:${APP_VERSION}"
          docker pull --platform linux/amd64 "$IMAGE_REF"
          docker save "$IMAGE_REF" | gzip -1 > "discord-bot-image-v${APP_VERSION}.tar.gz"

      - name: Create release archive
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          cp docker-compose.release.yml docker-compose.yml
          zip -r "discord-bot-v${APP_VERSION}.zip" \
            "discord-bot-image-v${APP_VERSION}.tar.gz" \
            docker-compose.yml \
            README.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: discord-bot-v${{ steps.vars.outputs.version }}.zip
