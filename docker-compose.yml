services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - ADMIN_UI_HOST=0.0.0.0

  sqlite-web:
    image: coleifer/sqlite-web:latest
    container_name: discord-bot-sqlite-web
    restart: unless-stopped
    depends_on:
      - discord-bot
    volumes:
      - ./data:/data:ro
    command:
      - sqlite_web
      - /data/bot-config.sqlite
      - --host
      - 0.0.0.0
      - --port
      - "8080"
